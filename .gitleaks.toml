[extend]
useDefault = true

[allowlist]
description = "Global allowlist - intentional dummy creds / docs examples only"
paths = [
  ".gitleaks.toml",
  ".trivy.yaml",
  "sonar-project.properties",
  "README.md",
  "SECURITY.md",
  "TROUBLESHOOTING.md",
  "terraform/user-data.sh",
  "app/.env.example",
  ".env.example",
  "docs/"
]

[[rules]]
id = "custom-token"
description = "Detect custom API tokens"
regex = '''(?i)(?:app|api|secret)_token['\"\s]*[:=]['\"\s]*([a-z0-9\-_]{20,})'''
tags = ["custom", "api-token"]
